# Include ONLY in the dedicated Mesemondo PostgreSQL cluster. Restart required.
# For a ~1 GB VPS shared with Synsigra. Durability settings remain unchanged.
shared_buffers = 32MB
max_connections = 16
work_mem = 1MB
maintenance_work_mem = 16MB
autovacuum_work_mem = 8MB
effective_cache_size = 128MB
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
max_parallel_workers = 0
jit = off
