# Include only inside the existing www.timeonion.com HTTPS server.
# Owns these two locations only. Confirm 8092 is free before deployment.
location = /mesemondo {
    access_log off;
    error_log /dev/null crit;
    default_type text/plain;
    return 200 "Mesemondo API: /mesemondo/api/v1/\n";
}
location ^~ /mesemondo/ {
    # URLs may contain download tickets / checkout capabilities.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_next_upstream off;
    gzip off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Range $http_range;
    proxy_set_header Accept-Encoding "";
    proxy_redirect off;
    # Trailing slash strips /mesemondo, retaining /api/v1/...
    proxy_pass http://127.0.0.1:8092/;
    error_page 413 = @mesemondo_body_limit;
    error_page 502 503 504 = @mesemondo_unavailable;
}
location @mesemondo_body_limit {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    return 413 '{"error":{"code":"INVALID_ARGUMENT","message":"Request too large"},"request_id":"$request_id"}';
}
location @mesemondo_unavailable {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    return 503 '{"error":{"code":"BUSY","message":"Service unavailable"},"request_id":"$request_id"}';
}
